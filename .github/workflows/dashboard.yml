name: Bot Dashboard y Auditoría Web

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta automáticamente cada 6 horas

jobs:
  actualizar-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Bot Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_dashboard.py

      - name: Guardar y subir cambios a GitHub (para Netlify)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database_ecosistema.json || true
          git commit -m "Auto-update: Actualización de base de datos del ecosistema" || exit 0
          git push
