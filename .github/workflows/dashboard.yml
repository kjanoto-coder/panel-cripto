name: Bot Dashboard y Auditoría Web

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  actualizar-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Bot Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: python bot_dashboard.py

      - name: Guardar y subir cambios a GitHub (para Netlify)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database_ecosistema.json
          git commit -m "Auto-update: Sincronización del Dashboard y Auditoría" || exit 0
          git push
