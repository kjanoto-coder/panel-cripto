name: Executar Bot Cripto / Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'  # Se ejecuta automáticamente cada 15 minutos
  workflow_dispatch:        # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Permiso obligatorio para que el bot pueda subir cambios al repositorio
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ejecutar Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_dashboard.py

      - name: Guardar y hacer Push de cambios al Repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD_CRIPTO.md historico_alertas.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: Sincronización automática de Dashboard [skip ci]" && git push)
