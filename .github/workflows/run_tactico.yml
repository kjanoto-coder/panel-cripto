name: Etapa 1 - Cazador Tactico

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

concurrency:
  group: etapa1-cazador-tactico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tactico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (incluye openpyxl y Gemini IA)
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib openpyxl google-genai

      - name: Ejecutar Cazador Táctico IA
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_TACTICO: ${{ secrets.TOPIC_ID_TACTICO }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_tactico.py

      - name: Guardar historial, Excel táctico y reporte IA sin conflictos
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          ARCHIVOS="historial_perlas.json historial_ganadoras.json HISTORICO_CAZADOR_TACTICO.xlsx reporte_ia_tactico.json"
          git add -f $ARCHIVOS || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar historial, excel tactico y reporte IA [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase -X ours origin main; then
                if git push origin main; then
                  break
                fi
              else
                git checkout --ours $ARCHIVOS || true
                git add -f $ARCHIVOS || true
                git rebase --continue || git rebase --abort || true
              fi
              sleep 3
            done
          fi
