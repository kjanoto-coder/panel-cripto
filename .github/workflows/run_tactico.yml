name: Etapa 1 - Cazador Tactico

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tactico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (incluye Gemini IA)
        run: pip install requests matplotlib google-genai

      - name: Ejecutar Cazador Táctico IA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_TACTICO: ${{ secrets.TOPIC_ID_TACTICO }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_tactico.py

      - name: Guardar historial de estrellas y graduadas sin conflictos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_perlas.json historial_ganadoras.json
          if ! git diff --staged --quiet; then
            git commit -m "Update historial desde Cazador Tactico (Etapa 1)"
            git pull --rebase origin main || true
            git push
          fi
