name: Cazador Táctico IA (Bajo Valor)

on:
  schedule:
    - cron: '*/15 * * * *' # Se ejecuta automáticamente cada 15 minutos
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-tactical-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_tactico.txt

      - name: Ejecutar Cazador Táctico
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_tactico.py
