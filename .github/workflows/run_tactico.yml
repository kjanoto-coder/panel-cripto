name: Cazador Tactico IA

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-repositorio-cripto
  cancel-in-progress: false

jobs:
  run-tactico:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (incluye Gemini IA)
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib google-genai

      - name: Ejecutar Cazador Táctico IA
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_TACTICO: ${{ secrets.TOPIC_ID_TACTICO }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_tactico.py

      - name: Guardar historial de estrellas y graduadas sin conflictos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f historial_perlas.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Radar Cazador Táctico"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                break
              fi
              git rebase --abort || true
              sleep 5
            done
          fi
