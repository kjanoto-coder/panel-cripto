name: Enviar Alerta Telegram

on:
  workflow_dispatch:

permissions:
  contents: write # Obligatorio para que GitHub permita actualizar la memoria de perlas

# Semáforo global: sincroniza las escrituras en el repositorio entre todos los bots
concurrency:
  group: escritura-repositorio-cripto
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (incluye Gemini IA)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install requests numpy matplotlib google-genai

      - name: Ejecutar Bot Cripto Central
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_cripto.py

      - name: Guardar memoria de perlas sin conflictos (con reintentos)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimas_perlas.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Memoria ultimas perlas (bot_cripto)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "⚠️ Conflicto de push con otro bot, reintentando en 5s..."
              sleep 5
            done
          fi
