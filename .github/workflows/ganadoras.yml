name: Bot Monedas Ganadoras / Central de Inteligencia

on:
  schedule:
    # Se ejecuta de forma estricta cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite forzar la ejecución manual al instante con un botón si GitHub lo frena

jobs:
  run-ganadoras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Bot de Ganadoras
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_GANADORAS: ${{ secrets.TOPIC_ID_GANADORAS }}
        run: |
          python bot_ganadoras.py
