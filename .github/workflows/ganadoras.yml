name: Bot Monedas Ganadoras

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Vital para que no pierda la sincronización con GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Bot Ganadoras
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_GANADORAS: ${{ secrets.TOPIC_ID_GANADORAS }}
        run: |
          python bot_ganadoras.py

      - name: Auto-commit del historial CSV
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update: Registro en historico_alertas.csv [skip ci]"
          file_pattern: "historico_alertas.csv"
