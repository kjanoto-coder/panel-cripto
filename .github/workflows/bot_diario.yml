name: Reporte Diario Monedas Ganadoras

on:
  schedule:
    # Se ejecuta todos los días exactamente a las 00:00 UTC (o ajusta la hora si prefieres otro horario)
    - cron: '0 0 * * *'
  workflow_dispatch: # Te permite forzar el envío de este reporte diario con un botón manual cuando lo desees

jobs:
  run-reporte-diario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Reporte Diario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_GANADORAS: ${{ secrets.TOPIC_ID_GANADORAS }}
        run: |
          python bot_ganadoras.py
