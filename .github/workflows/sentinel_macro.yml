name: Sentinel Macro Global Alert

on:
  schedule:
    # Vigila giros Rojo/Verde cada 10 min y manda el reporte completo cada 30 min
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Semáforo global: si otro bot está guardando datos, este espera su turno sin cancelarse
concurrency:
  group: escritura-repositorio-cripto
  cancel-in-progress: false

jobs:
  run-sentinel-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas google-genai yfinance matplotlib squarify beautifulsoup4 lxml urllib3

      - name: Run Sentinel Macro Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_SENTINEL_MACRO: ${{ secrets.TOPIC_ID_SENTINEL_MACRO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_sentinel_macro.py

      - name: Guardar memoria de mercado sin conflictos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_sentinel_macro.json historial_noticias.json database_ecosistema.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Memoria Sentinel Macro y Noticias"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "⚠️ Reintentando push en 5s..."
              sleep 5
            done
          fi
