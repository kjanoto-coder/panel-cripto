name: Sentinel Macro Global Alert

on:
  schedule:
    # Se ejecuta 3 veces al día coincidiendo con apertura/cierre de Wall Street
    - cron: '0 13 * * 1-5'  # 10:00 AM ART (Apertura NY)
    - cron: '0 17 * * 1-5'  # 02:00 PM ART (Mid-day NY)
    - cron: '0 21 * * 1-5'  # 06:00 PM ART (Cierre NY)
  workflow_dispatch:        # Permite ejecución manual

jobs:
  run-sentinel-macro:
    runs-run-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas google-genai yfinance

      - name: Run Sentinel Macro Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_SENTINEL_MACRO: ${{ secrets.TOPIC_ID_SENTINEL_MACRO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_sentinel_macro.py
