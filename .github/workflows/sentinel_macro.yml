name: Sentinel Macro Global Alert

on:
  schedule:
    # Se ejecuta cada 30 minutos de forma continua
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  run-sentinel-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas google-genai yfinance matplotlib squarify

      - name: Run Sentinel Macro Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_SENTINEL_MACRO: ${{ secrets.TOPIC_ID_SENTINEL_MACRO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_sentinel_macro.py

      - name: Commit & Push Historial de Noticias
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_noticias.json datos_sentinel_macro.json || true
          git commit -m "Auto-update: Historial de noticias y datos macro" || true
          git push || true
