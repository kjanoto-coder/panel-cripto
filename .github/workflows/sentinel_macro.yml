name: Sentinel Macro Global Alert

on:
  schedule:
    # Se ejecuta cada 30 minutos de forma continua (media hora)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  run-sentinel-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas google-genai yfinance matplotlib squarify beautifulsoup4 lxml urllib3

      - name: Run Sentinel Macro Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_SENTINEL_MACRO: ${{ secrets.TOPIC_ID_SENTINEL_MACRO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_sentinel_macro.py

      - name: Commit & Push Historial de Noticias y Datos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update: Historial de noticias, datos macro y dashboard (30 min)" || true
          git push || true
