name: Criptos Pre-Explosion IA

on:
  schedule:
    # Se ejecuta cada 15 minutos continuos (desplazado para evitar colas)
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

concurrency:
  group: escritura-pre-explosion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pre-explosion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib openpyxl google-genai

      - name: Ejecutar Bot de Pre-Explosión
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_PRE_EXPLOSION: ${{ secrets.TOPIC_ID_PRE_EXPLOSION }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TOPIC_ID_PRE_EXPLOSION }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_pre_explosion.py

      - name: Guardar Historial Compartido, Excel y Reporte IA sin conflictos
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          ARCHIVOS="historial_perlas.json AUDITORIA_PRE_EXPLOSION.xlsx reporte_ia_pre_explosion.json"
          git add -f $ARCHIVOS || true
          [ -f datos_pre_explosion_ia.json ] && git add -f datos_pre_explosion_ia.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar estado Pre-Explosion IA, Excel y reporte [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase -X ours origin main; then
                if git push origin main; then
                  break
                fi
              else
                git checkout --ours $ARCHIVOS || true
                git add -f $ARCHIVOS || true
                git rebase --continue || git rebase --abort || true
              fi
              sleep 4
            done
          fi
