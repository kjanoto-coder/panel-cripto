name: Criptos Pre-Explosion IA

on:
  schedule:
    # Se ejecuta de forma exacta cada 15 minutos continuos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecución manual instantánea desde GitHub

permissions:
  contents: write

jobs:
  run-pre-explosion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install requests ccxt pandas matplotlib google-genai

      - name: Ejecutar Bot de Pre-Explosión
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_PRE_EXPLOSION: ${{ secrets.TOPIC_ID_PRE_EXPLOSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_pre_explosion.py

      - name: Guardar Estado de Pre-Explosión
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_pre_explosion_ia.json || true
          git commit -m "Auto-update: Datos Pre-Explosión IA" || true
          git push || true
