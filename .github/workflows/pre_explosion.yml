name: Criptos Pre-Explosion IA

on:
  schedule:
    # Se ejecuta cada 15 minutos continuos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecución manual instantánea desde GitHub

permissions:
  contents: write

concurrency:
  group: escritura-repositorio-cripto
  cancel-in-progress: false

jobs:
  run-pre-explosion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests ccxt pandas matplotlib google-genai

      - name: Ejecutar Bot de Pre-Explosión
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_PRE_EXPLOSION: ${{ secrets.TOPIC_ID_PRE_EXPLOSION }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TOPIC_ID_PRE_EXPLOSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_pre_explosion.py

      - name: Guardar Historial Compartido sin conflictos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f historial_perlas.json datos_pre_explosion_ia.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Estado Pre-Explosión IA"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                break
              fi
              git rebase --abort || true
              sleep 5
            done
          fi

# FIN WORKFLOW PRE EXPLOSION
