name: Etapa 4 - Gestor Semanal Prueba

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: etapa4-gestor-semanal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-semanal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests matplotlib openpyxl google-genai

      - name: Ejecutar Gestor Semanal Blindado 3 Niveles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_SEMANAL: ${{ secrets.TOPIC_ID_SEMANAL }}
          TOPIC_ID_CENTRAL: ${{ secrets.TOPIC_ID_CENTRAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_semanal.py

      - name: Actualizar tema Resumen al instante
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_RESUMEN: ${{ secrets.TOPIC_ID_RESUMEN }}
        run: sleep 4 && python bot_resumen_semanal.py

      - name: Guardar plan semanal y Excel sin conflictos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plan_semanal.json AUDITORIA_SEMANAL_PRUEBA.xlsx
          [ -f resumen_topic_config.json ] && git add resumen_topic_config.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update plan semanal IA 3 niveles y autopsia"
            git pull --rebase origin main || true
            git push
          fi
