name: Perdedoras En Vivo IA

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-perdedoras-silencioso
  cancel-in-progress: false

jobs:
  run-perdedoras-vivo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Ejecutar detector en vivo en caídas
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID_PERDEDORAS: ${{ secrets.TOPIC_ID_PERDEDORAS }}
          STATE_FILE: "perdedoras_silenciosas.json"
          CAPITAL_REFERENCIA_USD: "2000"
          ALERT_ON_RECHAZO: "false"
          COOLDOWN_MINUTES: "15"
          LIVE_STEP_DROP_PCT: "1.0"
          LIVE_TICK_DROP_PCT: "0.7"
        run: python bot_perdedoras.py

      - name: Guardar memoria de caídas sin conflictos
        run: |
          STATE_PATH="${STATE_FILE:-perdedoras_silenciosas.json}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$STATE_PATH" || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Memoria Perdedoras En Vivo [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase -X ours origin main; then
                if git push origin main; then
                  break
                fi
              else
                git checkout --ours "$STATE_PATH" || true
                git add -f "$STATE_PATH" || true
                git rebase --continue || git rebase --abort || true
              fi
              sleep 5
            done
          fi
